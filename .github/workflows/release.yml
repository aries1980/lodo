name: Release

on:
  push:
    # Release tags look like 0.1.1 - no "v" prefix.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (must already exist on the remote)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The tag being released; the pushed tag on a push, the requested tag on a
  # manual run.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          # The Go version lives in go.mod - one place to bump.
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signing the attestations with Sigstore needs an OIDC token, and the
      # attestations themselves are stored against the repository.
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        id: pkg
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The SQLite driver is pure Go, so the binaries cross-compile.
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist stage
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags '-s -w' -o "dist/lodo${ext}" ./cmd/lodo
          name="lodo_${VERSION}_${GOOS}_${GOARCH}"
          cp "dist/lodo${ext}" LICENSE README.md stage/
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -qr "../dist/${name}.zip" .)
            echo "file=${name}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "dist/${name}.tar.gz" -C stage .
            echo "file=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          rm -rf stage "dist/lodo${ext}"
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: dist/${{ steps.pkg.outputs.file }}
          format: spdx-json
          output-file: dist/lodo_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.pkg.outputs.file }}
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.pkg.outputs.file }}
          sbom-path: dist/lodo_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: lodo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.packager }} ${{ matrix.arch }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        packager: [deb, rpm, apk]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: lodo-linux-${{ matrix.arch }}
          merge-multiple: true
          path: pkgsrc
      - name: Build package
        env:
          ARCH: ${{ matrix.arch }}
          PACKAGER: ${{ matrix.packager }}
        run: |
          set -eu
          mkdir -p dist stage
          tar -xzf "pkgsrc/lodo_${VERSION}_linux_${ARCH}.tar.gz" -C stage
          test -f stage/lodo
          case "$ARCH-$PACKAGER" in
            amd64-deb) PKGARCH=amd64 ;;
            arm64-deb) PKGARCH=arm64 ;;
            amd64-rpm|amd64-apk) PKGARCH=x86_64 ;;
            arm64-rpm|arm64-apk) PKGARCH=aarch64 ;;
            *) echo "unknown $ARCH-$PACKAGER"; exit 1 ;;
          esac
          cat > nfpm.yaml <<EOF
          name: "lodo"
          arch: "${PKGARCH}"
          platform: "linux"
          version: "${VERSION}"
          section: "utils"
          priority: "optional"
          maintainer: "Janos Feher <517870+aries1980@users.noreply.github.com>"
          description: "Local-first CLI that reads schedulable Tasks from Logseq and projects them to Google Calendar."
          vendor: "aries1980"
          homepage: "https://github.com/aries1980/lodo"
          license: "MIT"
          contents:
            - src: /app/stage/lodo
              dst: /usr/bin/lodo
              type: file
              file_info:
                mode: 0755
            - src: /app/stage/LICENSE
              dst: /usr/share/doc/lodo/copyright
              type: file
            - src: /app/stage/README.md
              dst: /usr/share/doc/lodo/README.md
              type: file
          EOF
          docker run --rm -v "$PWD:/app" -w /app docker.io/goreleaser/nfpm:v2.49.0 package --config /app/nfpm.yaml --packager "$PACKAGER" --target /app/dist/
          out=$(ls dist/*."$PACKAGER" | head -1)
          mv "$out" "dist/lodo_${VERSION}_linux_${ARCH}.${PACKAGER}"
          rm -f nfpm.yaml
          ls -l dist/
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          file: dist/lodo_${{ env.VERSION }}_linux_${{ matrix.arch }}.${{ matrix.packager }}
          format: spdx-json
          output-file: dist/lodo_${{ env.VERSION }}_linux_${{ matrix.arch }}.${{ matrix.packager }}.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/lodo_${{ env.VERSION }}_linux_${{ matrix.arch }}.${{ matrix.packager }}
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/lodo_${{ env.VERSION }}_linux_${{ matrix.arch }}.${{ matrix.packager }}
          sbom-path: dist/lodo_${{ env.VERSION }}_linux_${{ matrix.arch }}.${{ matrix.packager }}.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: lodo-package-${{ matrix.arch }}-${{ matrix.packager }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [build, package]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its assets.
      contents: write
      # Keyless signing through Sigstore.
      id-token: write
    steps:
      # Checked out on main, not on the tag: the changelog is committed back to
      # main. git-cliff needs the whole history and every tag.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: lodo-*
          merge-multiple: true
          path: release
      - name: Changelog
        run: |
          set -eu
          # The release notes: only the commits between the previous tag and this one.
          prev=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="${prev}..${VERSION}"
          else
            range="$(git rev-list --max-parents=0 "${VERSION}")..${VERSION}"
          fi
          cliff() {
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/app" \
              -w /app \
              docker.io/orhunp/git-cliff:2.14.2 \
              "$@"
          }
          cliff "$range" --strip header --output notes.md
          cliff --output CHANGELOG.md
          cp CHANGELOG.md release/CHANGELOG.md
      - name: Checksums
        run: |
          set -eu
          cd release
          sha256sum lodo_*.tar.gz lodo_*.zip lodo_*.deb lodo_*.rpm lodo_*.apk lodo_*.spdx.json > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign artifacts and checksums
        run: |
          set -eu
          for f in release/lodo_*.tar.gz release/lodo_*.zip release/lodo_*.deb release/lodo_*.rpm release/lodo_*.apk; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" release/* --clobber
          else
            args=(--verify-tag --title "lodo $VERSION" --notes-file notes.md)
            case "$VERSION" in
              *-*) args+=(--prerelease) ;;
              *) args+=(--latest) ;;
            esac
            gh release create "$VERSION" release/* "${args[@]}"
          fi
      - name: Commit the changelog
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit --no-gpg-sign -m "chore(changelog): update CHANGELOG.md for $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
