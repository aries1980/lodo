version: "2"

run:
  modules-download-mode: mod

linters:
  default: standard
  enable:
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: '^httptest\.NewServer$'
          msg: use httptest.NewTestServer so the server shuts down with the test

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/aries1980/lodo
